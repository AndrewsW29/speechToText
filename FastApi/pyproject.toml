[project]
name = "voice-assistant-api"
version = "0.1.0"
description = "Voice-driven developer assistant backend (hexagonal, FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "pikepdf>=9.4",
    "pypdf>=5.1",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1"]
embeddings = ["sentence-transformers>=3.3", "torch>=2.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "testcontainers>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

ml-core = [
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "seqeval>=1.2",
    "jiwer>=3.1",
    "rapidfuzz>=3.10",
    "pandas>=2.2",
    "great-expectations>=1.3",
    "pyyaml>=6.0",
]
pdf-corpus = [
    "reportlab>=4.2",
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "apted>=1.0",
    "pikepdf>=9.4",
    "pypdf>=5.1",
    "numpy>=2.0",
    "jiwer>=3.1",
]
ml = [
    { include-group = "ml-core" },
    "tensorflow>=2.20",
    "keras>=3.9",
    "keras-hub>=0.19",
    "mlflow>=2.19",
    "dvc[s3]>=3.58",
    "piper-tts>=1.2",
    "label-studio-sdk>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "ml/tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing -m 'not gates'"
markers = [
    "integration: needs external services",
    "gates: model quality gates (red until a model exists; run with -m gates)",
]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

# CPU-only torch on Linux keeps the runtime image small (the default wheels pull CUDA libraries).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

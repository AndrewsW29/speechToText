[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is read from VA_DATABASE_URL in alembic/env.py (never hardcoded).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

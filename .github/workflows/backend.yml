name: backend
on:
  push:
    paths: ["FastApi/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["FastApi/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: FastApi

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - name: Unit and contract tests (coverage gate)
        run: uv run pytest tests/unit tests/contract --cov-fail-under=80
      - name: Integration tests
        run: uv run pytest tests/integration --no-cov

  intent-golden-gate:
    # Trains the intent model and checks it against the frozen golden set (macro-F1, slot F1, OOD recall, ECE).
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --frozen --group ml
      - run: uv run --group ml python -m ml.training.intent.pipeline --epochs 30 --seed 7
      - run: uv run --group ml pytest tests/ml -m gates -q --no-cov

  image:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f deploy/docker/Dockerfile -t va-api:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: va-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

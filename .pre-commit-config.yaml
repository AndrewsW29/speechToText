repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^FastApi/app/
        args: [--config-file=FastApi/mypy.ini]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: postman-collection-sync
        name: Postman collection is in sync with openapi.yaml
        entry: uv run --project FastApi python FastApi/scripts/postman_collection.py --check
        language: system
        pass_filenames: false
        files: ^FastApi/(api-contracts/openapi\.yaml|postman/(flows|scripts)/.*|scripts/postman_collection\.py)$

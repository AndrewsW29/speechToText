build:
  maxIssues: 0
style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/ui/theme/**']
complexity:
  LongMethod:
    threshold: 60
naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
